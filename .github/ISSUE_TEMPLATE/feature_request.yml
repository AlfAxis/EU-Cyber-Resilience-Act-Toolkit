name: Feature request
description: Suggest an improvement or a new ecosystem
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: input
    id: obligation
    attributes:
      label: CRA obligation it supports (if any)
      placeholder: "Annex I, Part II, point 1"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
