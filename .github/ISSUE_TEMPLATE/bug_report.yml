name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets, private package names or customer data.**
        Redact anything sensitive from output before posting.
  - type: input
    id: version
    attributes:
      label: cra-toolkit version
      description: Output of `cra-toolkit --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
      placeholder: "Python 3.12.4, Windows 11"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the full output and exit code.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input that reproduces it
      description: For parsing problems, the smallest lockfile or manifest snippet that triggers it.
