# Example: run cra-toolkit in your own repository's CI.
#
# Copy this file to .github/workflows/cra-compliance.yml in the repository that contains
# the product you ship, and adjust the marked values.

name: CRA compliance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new advisories are published without any change to your code, so a
    # product that was clean last week can have an open finding today.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pin an exact version so a toolkit update never changes your results unannounced.
      - name: Install cra-toolkit
        run: pip install "cra-toolkit==0.1.1"

      # Exit codes: 0 ok · 1 findings at/above --fail-on · 2 error (e.g. OSV.dev unreachable).
      # Choose the gate that matches your risk appetite: critical | high | medium | low | any.
      - name: Inventory and vulnerability check
        run: >
          cra-toolkit scan .
          --fail-on high
          --sbom sbom.cdx.json
          --report scan-report.json
          --no-archive
          --production-only
        # Accept a specific, reviewed finding with:  --ignore CVE-YYYY-NNNNN
        # Fully offline? Add:  --offline-db ./osv-db   (see docs/offline-scanning.md)

      # Keep the evidence even (especially) when the gate fails.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cra-evidence-${{ github.sha }}
          path: |
            sbom.cdx.json
            scan-report.json
          retention-days: 90
