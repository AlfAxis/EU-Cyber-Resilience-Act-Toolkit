[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cra-toolkit"
dynamic = ["version"]
description = "Open-source tooling for EU Cyber Resilience Act compliance — SBOM generation, vulnerability matching, and Article 14 report drafting from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cyber-resilience-act",
    "cra",
    "sbom",
    "cyclonedx",
    "osv",
    "vulnerability",
    "compliance",
    "eu",
    "article-14",
    "supply-chain-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<3",
    "types-requests",
    "cyclonedx-python-lib[json-validation]>=8",
    "build",
    "twine",
]

[project.scripts]
cra-toolkit = "cra_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/AlfAxis/EU-Cyber-Resilience-Act-Toolkit"
Repository = "https://github.com/AlfAxis/EU-Cyber-Resilience-Act-Toolkit"
Issues = "https://github.com/AlfAxis/EU-Cyber-Resilience-Act-Toolkit/issues"
Changelog = "https://github.com/AlfAxis/EU-Cyber-Resilience-Act-Toolkit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/cra_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cra_toolkit"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cra_toolkit"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "PT", "PIE", "RET"]
ignore = [
    "RUF001",  # German text legitimately contains typographic characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The message catalog is prose; wrapping legal sentences mid-literal hurts readability.
"src/cra_toolkit/i18n.py" = ["E501"]
# pytest's assertion rewriting reports each operand of a composite assert.
"tests/**" = ["B011", "PT018"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true
